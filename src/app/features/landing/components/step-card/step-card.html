<div
  class="relative flex h-56 flex-col items-center justify-center gap-6 rounded-xl border-2 border-gray-200 bg-white p-6 text-center transition-all hover:border-gray-300 hover:shadow-md sm:h-48 md:flex-row md:text-left"
>
  <div
    class="absolute -top-4 -left-4 flex h-12 w-12 items-center justify-center rounded-full bg-black text-lg text-white"
  >
    {{ step }}
  </div>
  <lucide-icon
    [img]="icon"
    class="flex h-16 w-16 items-center rounded-xl border-gray-200 bg-gray-100 p-2 group-hover:bg-black group-hover:text-white"
  ></lucide-icon>
  <div>
    <h3 class="text-xl font-semibold">{{ title }}</h3>
    <p>{{ paragraph }}</p>
  </div>
</div>
