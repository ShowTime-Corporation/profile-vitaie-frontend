<h2 class="text-center text-3xl">Everything You Need to Grow</h2>
<p class="max-w-xs text-center text-gray-700 md:max-w-xl">
  ProfileVit[AI]e combines intelligent analysis with practical guidance to help tech professionals
  level up their careers.
</p>

<div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
  <app-feature-card
    [icon]="Brain"
    title="AI-Powered Analysis"
    paragraph="Advanced artificial intelligence analyzes your profile, skills, and experience to provide deep insights into your professional strengths and areas for growth."
  >
  </app-feature-card>
  <app-feature-card
    [icon]="Target"
    title="Personalized Roadmaps"
    paragraph="Get custom growth plans tailored to your current level and career goals, with step-by-step guidance to reach your next professional milestone."
  >
  </app-feature-card>
  <app-feature-card
    [icon]="Briefcase"
    title="Job Opportunities"
    paragraph="Access curated job offers that match your skills and career trajectory, helping you find opportunities that align with your development path."
  >
  </app-feature-card>
  <app-feature-card
    [icon]="FileCode"
    title="Portfolio Building"
    paragraph="Receive AI-suggested projects that strengthen your portfolio and align with current industry demands, making you more competitive."
  >
  </app-feature-card>
  <app-feature-card
    [icon]="TrendingUp"
    title="Skill Gap Detection"
    paragraph="Identify missing competencies and get recommendations on what to learn next based on industry trends and your career objectives."
  >
  </app-feature-card>
  <app-feature-card
    [icon]="Shield"
    title="Secure & Private"
    paragraph="Your data is protected with enterprise-grade security. We follow best practices to ensure your professional information stays safe."
  >
  </app-feature-card>
</div>
