<h2 class="flex items-center justify-center gap-2 rounded-2xl bg-black px-4 py-2 text-white">
  <lucide-icon [img]="Sparkles" class="h-6 w-6"></lucide-icon>
  <span>AI-Powered Career Growth</span>
</h2>
<h1 class="text-center text-3xl">
  Accelerate Your Tech Career with powerful
  <span class="bg-gradient-to-r from-purple-400 to-pink-600 bg-clip-text text-transparent"
    >AI Guidance</span
  >
</h1>
<p class="max-w-xs text-center text-gray-700 md:max-w-xl">
  ProfileVit[AI]e analyzes your skills, experience, and portfolio to generate personalized
  diagnostics and growth roadmaps that guide you toward better career opportunities.
</p>
<ul class="flex h-fit flex-col items-center justify-center gap-4 md:flex-row md:gap-6">
  <li class="h-16 w-full md:w-fit">
    <button
      class="group flex h-full w-full items-center justify-center gap-2 rounded-lg bg-black px-6 text-white transition-colors hover:cursor-pointer hover:bg-gray-800"
      (click)="modal.openSignupModal()"
    >
      <span>Get started free</span>
      <lucide-icon
        [img]="ArrowRight"
        class="size-6 transition-transform duration-200 group-hover:translate-x-0.5"
      ></lucide-icon>
    </button>
  </li>
  <li class="h-16 w-full md:w-fit">
    <a
      href="#pricing"
      class="flex h-full w-full items-center justify-center gap-2 rounded-lg border-2 border-gray-300 px-6 transition-colors hover:cursor-pointer hover:border-black"
    >
      View Premium Features
    </a>
  </li>
</ul>
<hr class="w-10/12 text-gray-200 md:w-6/12" />
<div class="flex flex-col gap-12 md:flex-row md:gap-24">
  <app-hero-highlight title="AI-Powered" subtitle="Smart Analysis"></app-hero-highlight>
  <app-hero-highlight title="Personalized" subtitle="Growth Roadmaps"></app-hero-highlight>
  <app-hero-highlight title="Real-Time" subtitle="Job Opportunities"></app-hero-highlight>
</div>
