<section class="page-container grid grid-cols-1 lg:grid-cols-2 gap-5 py-12">
  @if (roadmap) {
    <app-content-card title="Analysis" content="{{roadmap.roadAnalysis}}"></app-content-card>
    <app-content-card title="Proposal" content="{{roadmap.roadProposal}}"></app-content-card>
    <app-content-card title="Ideas" content="{{roadmap.roadIdeas}}"></app-content-card>
    <app-content-card title="Keep" content="{{roadmap.roadKeep}}"></app-content-card>
  } @else {
    <div class="p-8 bg-white rounded-xl border border-gray-200 w-full shadow-md text-center col-start-1 col-end-3">
      <h2 class="text-gray-700">No roadmap generated yet, <a class="font-semibold cursor-pointer">Click here to generate one.</a></h2>
    </div>
  }
</section>
