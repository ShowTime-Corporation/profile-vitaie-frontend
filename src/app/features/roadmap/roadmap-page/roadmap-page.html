<section class="page-container flex flex-col gap-6 py-12">
  <div class="text-center md:text-left">
    <h1 class="text-2xl font-semibold">{{ user()?.firstName }} {{ user()?.lastName }}'s Roadmap</h1>
    <p class="text-gray-700">Here you can see your roadmap information</p>
  </div>
  <div class="flex flex-col gap-4">
    @if (roadmap) {
      <app-content-card title="Analysis" content="{{ roadmap.roadAnalysis }}"></app-content-card>
      <app-content-card title="Proposal" content="{{ roadmap.roadProposal }}"></app-content-card>
      <app-content-card title="Ideas" content="{{ roadmap.roadIdeas }}"></app-content-card>
      <app-content-card title="Keep" content="{{ roadmap.roadKeep }}"></app-content-card>
    } @else {
      <div class="w-full rounded-xl border border-gray-200 bg-white p-8 text-center shadow-md">
        <h2 class="text-gray-700">
          No roadmap generated yet,
          <a class="cursor-pointer font-semibold">Click here to generate one.</a>
        </h2>
      </div>
    }
  </div>
</section>
