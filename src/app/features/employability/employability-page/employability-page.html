<section class="page-container flex flex-col gap-6 py-12">
  <div class="text-center md:text-left">
    <h1 class="text-2xl font-semibold">
      {{ user()?.firstName }} {{ user()?.lastName }}'s Employability
    </h1>
    <p class="text-gray-700">Here you can see your employability offers</p>
  </div>
  <div class="flex flex-col gap-4">
    @if (employability) {
      <app-content-card
        title="Tech Offer"
        content="{{ employability.employabilityTechOffer }}"
      ></app-content-card>
      <app-content-card
        title="Education Offer"
        content="{{ employability.employabilityEducationOffer }}"
      ></app-content-card>
      <app-content-card
        title="Company Offer"
        content="{{ employability.employabilityCompanyOffer }}"
      ></app-content-card>
    } @else {
      <div class="w-full rounded-xl border border-gray-200 bg-white p-8 text-center shadow-md">
        <h2 class="text-gray-700">
          No employability generated yet,
          <a class="cursor-pointer font-semibold">Click here to generate one.</a>
        </h2>
      </div>
    }
  </div>
</section>
