<div
  class="relative flex min-h-172 w-128 flex-col justify-between rounded-xl p-8"
  [ngClass]="{
    'bg-gradient-to-br from-gray-900 to-gray-700 shadow-lg': highlight,
    'border border-gray-200 bg-white shadow-sm': !highlight,
  }"
>
  @if (highlight) {
    <div
      class="absolute top-4 right-4 flex items-center justify-center gap-1 rounded-full bg-white px-3 py-1 text-xs font-semibold text-gray-700 shadow-md"
    >
      <lucide-icon [img]="Zap" class="h-3 w-3"></lucide-icon>
      <span>Popular</span>
    </div>
  }
  <div class="flex h-full flex-col gap-6">
    <div class="flex items-center gap-2">
      @if (highlight) {
        <lucide-icon [img]="Crown" class="text-white"></lucide-icon>
      }
      <h2
        class="text-2xl"
        [ngClass]="{
          'flex items-center text-white': highlight,
          'text-black': !highlight,
        }"
      >
        {{ title }}
      </h2>
    </div>

    <p
      class="text-5xl"
      [ngClass]="{
        'text-white': highlight,
        'text-gray-700': !highlight,
      }"
    >
      {{ price }}
      <span
        class="text-xl"
        [ngClass]="{
          'text-white': highlight,
          'text-gray-700': !highlight,
        }"
        >{{ billingPeriod }}</span
      >
    </p>
    <p
      [ngClass]="{
        'text-white': highlight,
        'text-gray-700': !highlight,
      }"
    >
      {{ paragraph }}
    </p>
    <ul
      class="flex flex-col gap-2"
      [ngClass]="{
        'text-white': highlight,
        'text-gray-700': !highlight,
      }"
    >
      @for (feature of features; track feature) {
        <li class="flex items-center">
          <lucide-icon
            [img]="Check"
            [ngClass]="{
              'text-white': highlight,
              'text-gray700': !highlight,
            }"
          ></lucide-icon>
          <span class="ml-2">{{ feature }}</span>
        </li>
      }
    </ul>
    <a
      href="#"
      class="mt-auto flex h-16 w-full items-center justify-center gap-2 rounded-lg px-6 transition-colors"
      [ngClass]="{
        'cursor-not-allowed bg-gray-100 font-semibold text-gray-600': isCurrentPlan,
        'bg-gray-50 text-gray-700 hover:bg-gray-200': highlight && !isCurrentPlan,
        'border-2 border-gray-300 bg-white text-gray-700 hover:border-black':
          !highlight && !isCurrentPlan,
      }"
    >
      @if (highlight && !isCurrentPlan) {
        <lucide-icon [img]="Crown" class="stroke-2"></lucide-icon>
      }
      {{ buttonText }}
    </a>
  </div>
</div>
