<div class="flex flex-col gap-6 bg-gray-50 py-12">
  <div class="page-container px-0">
    <h1 class="text-2xl font-semibold">
      {{ user()?.firstName }} {{ user()?.lastName }}'s Resume
    </h1>
    <p class="text-gray-700">Here you can see your resume information</p>
  </div>
  <section class="page-container px-0 w-full grid grid-cols-1 gap-5 lg:grid-cols-2">
    @if (resume) {
      <app-content-card title="Info" content="{{ resume.resumeInfo }}"></app-content-card>
      <app-content-card
        title="Employability"
        content="{{ resume.resumeEmployability }}"
      ></app-content-card>
      <app-content-card title="Simple" content="{{ resume.resumeSimple }}"></app-content-card>
      <app-content-card
        title="Recommendation"
        content="{{ resume.resumeRecommendation }}"
      ></app-content-card>
    } @else {
      <div
        class="col-start-1 col-end-3 w-full rounded-xl border border-gray-200 bg-white p-8 text-center shadow-md"
      >
        <h2 class="text-gray-700">
          No resume generated yet,
          <a class="cursor-pointer font-semibold">Click here to generate one.</a>
        </h2>
      </div>
    }
  </section>
</div>
