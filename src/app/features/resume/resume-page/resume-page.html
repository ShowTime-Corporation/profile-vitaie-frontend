<section class="page-container flex flex-col gap-6 py-12">
  <div class="text-center md:text-left">
    <h1 class="text-2xl font-semibold">{{ user()?.firstName }} {{ user()?.lastName }}'s Resume</h1>
    <p class="text-gray-700">Here you can see your resume information</p>
  </div>
  <div class="flex flex-col gap-4">
    @if (isLoading()) {
      <div class="flex w-full items-center justify-center py-20" role="status" aria-live="polite" aria-busy="true">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-gray-300 border-t-black" aria-hidden="true"></div>
        <span class="sr-only">Loading resume</span>
      </div>
    } @else if (resume) {
      <app-content-card title="Info" content="{{ resume.resumeInfo }}"></app-content-card>
      <app-content-card
        title="Employability"
        content="{{ resume.employability }}"
      ></app-content-card>
      <app-content-card title="Simple" content="{{ resume.simple }}"></app-content-card>
      <app-content-card
        title="Recommendation"
        content="{{ resume.recommendation }}"
      ></app-content-card>
    } @else {
      <div class="w-full rounded-xl border border-gray-200 bg-white p-8 text-center shadow-md">
        <h2 class="text-gray-700">
          No resume generated yet,
          <a class="cursor-pointer font-semibold">Click here to generate one.</a>
        </h2>
      </div>
    }
  </div>
</section>
