@if (toastService.toast()) {
  <div
    class="fixed top-24 left-1/2 z-50 flex -translate-x-1/2 gap-2 rounded-xl bg-gradient-to-br from-gray-950 to-gray-900 px-6 py-4 text-lg font-medium text-white shadow-xl backdrop-blur transition-all duration-300 ease-out"
    [ngClass]="{
      'translate-y-0': visible(),
      '-translate-y-full': !visible(),
      'opacity-100': visible(),
      'opacity-0': !visible(),
    }"
  >
    @if (toastService.toast()?.type === 'success') {
      <lucide-icon [img]="Check"></lucide-icon>
    } @else if (toastService.toast()?.type === 'error') {
      <lucide-icon [img]="X"></lucide-icon>
    }
    {{ toastService.toast()?.message }}
  </div>
}
